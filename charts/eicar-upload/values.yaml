replicaCount: 1

image:
  repository: eicar-upload
  tag: local
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
annotations: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: eicar.test
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

affinity: {}
nodeSelector: {}
tolerations: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

upload:
  path: /data/uploads
  persistence:
    enabled: false
    existingClaim: ""
    size: 1Gi
    storageClass: ""

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /healthz
    initialDelaySeconds: 2
    periodSeconds: 5
